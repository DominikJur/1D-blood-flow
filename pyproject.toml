[project]
name = "1d-blood-flow"
version = "0.1.0"
description = "1D blood flow in arterial topologies (straight tube, Y-bifurcation, split-merge, double-Y): MUSCL finite-volume solver plus per-topology DeepXDE PINN surrogates, with 3D GIF visualization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepxde>=1.15.0",
    "imageio>=2.37.3",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "pymupdf>=1.27.2.3",
    "pyvista>=0.48.2",
    "torch>=2.12.0",
]
